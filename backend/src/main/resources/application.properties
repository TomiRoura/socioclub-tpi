spring.application.name=socioclub

# La base y el usuario se crean con sql/socioclub.sql
# Para entrar con otro usuario (por ejemplo root) definir DB_USER y DB_PASSWORD
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/socioclub_g13?characterEncoding=UTF-8
spring.datasource.username=${DB_USER:socioclub_g13}
spring.datasource.password=${DB_PASSWORD:SocioClub_2026}

# Las tablas ya las crea el script, con update Hibernate solo agrega lo que falte
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Los mensajes de las pantallas de secretaría usan la sesión; sin esto aparece ";jsessionid=..." en la URL
server.servlet.session.tracking-modes=cookie
