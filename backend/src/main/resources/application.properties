spring.application.name=socioclub
server.port=8080

# Conexión a MySQL. La base, las tablas, los datos y el usuario los crea sql/socioclub.sql.
# Para usar otro usuario, definir las variables de entorno DB_USER y DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/socioclub_g13?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Argentina/Cordoba
spring.datasource.username=${DB_USER:socioclub_g13}
spring.datasource.password=${DB_PASSWORD:SocioClub_2026}

# JPA / Hibernate. Las tablas ya las crea el script: "update" solo agrega lo que falte.
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola el SQL que arma Hibernate (sirve para explicar los métodos derivados).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf sin caché: los cambios en las vistas se ven al recargar.
spring.thymeleaf.cache=false

# Fechas en el JSON como "AAAA-MM-DD" (ya es el valor por defecto de Spring Boot, queda explícito).
spring.jackson.serialization.write-dates-as-timestamps=false
