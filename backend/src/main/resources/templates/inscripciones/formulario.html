<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Nueva inscripción')}"></head>
<body>
<header th:replace="~{fragmentos :: encabezado('inscripciones')}"></header>

<main class="contenedor contenedor--angosto">
    <h1>Nueva inscripción</h1>
    <p class="bajada">El sistema controla cuota al día, duplicados, máximo de actividades, edad y cupo.</p>

    <div th:replace="~{fragmentos :: mensajes}"></div>

    <form class="formulario" th:action="@{/inscripciones}" th:object="${inscripcion}" method="post">
        <div class="campo">
            <label for="socioId">Socio</label>
            <select th:field="*{socioId}" required>
                <option value="">Elegí un socio</option>
                <option th:each="s : ${socios}" th:value="${s.id}"
                        th:text="${s.apellido + ', ' + s.nombre + ' · DNI ' + s.dni + (s.estadoCuota.name() == 'MOROSO' ? ' · MOROSO' : '')}">Gómez, Marta</option>
            </select>
        </div>

        <div class="campo">
            <label for="actividadId">Actividad</label>
            <!-- Las actividades sin cupo se muestran igual (no se ocultan) para poder demostrar RN1. -->
            <select th:field="*{actividadId}" required>
                <option value="">Elegí una actividad</option>
                <option th:each="a : ${actividades}" th:value="${a.id}"
                        th:text="${a.nombre + ' · ' + a.edadMinima + ' a ' + a.edadMaxima + ' años · ' + (a.cupoDisponible == 0 ? 'SIN CUPO' : a.cupoDisponible + ' lugares')}">Yoga</option>
            </select>
        </div>

        <div class="botones">
            <button type="submit" class="boton">Inscribir</button>
            <a class="boton boton--secundario" th:href="@{/socios}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
