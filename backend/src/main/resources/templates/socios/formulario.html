<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head(${socio.id == null} ? 'Nuevo socio' : 'Editar socio')}"></head>
<body>
	<header th:replace="~{fragmentos :: encabezado('socios')}"></header>

	<main class="contenido contenido--angosto">
		<h1 th:text="${socio.id == null} ? 'Nuevo socio' : 'Editar a ' + (${#strings.isEmpty(socio.nombre)} ? 'socio' : ${socio.nombre} + ' ' + ${socio.apellido})">Nuevo socio</h1>

		<div th:replace="~{fragmentos :: mensajes}"></div>

		<form class="formulario" th:action="@{/socios/guardar}" th:object="${socio}" method="post">
			<input type="hidden" th:field="*{id}">

			<div class="fila-campos">
				<div class="campo">
					<label for="nombre">Nombre</label>
					<input type="text" th:field="*{nombre}" maxlength="50" required>
				</div>
				<div class="campo">
					<label for="apellido">Apellido</label>
					<input type="text" th:field="*{apellido}" maxlength="50" required>
				</div>
			</div>
			<div class="fila-campos">
				<div class="campo">
					<label for="dni">DNI (sin puntos)</label>
					<input type="text" th:field="*{dni}" inputmode="numeric" pattern="[0-9]{7,8}" maxlength="8" required>
				</div>
				<div class="campo">
					<label for="fechaNacimiento">Fecha de nacimiento</label>
					<input type="date" th:field="*{fechaNacimiento}" required>
				</div>
			</div>
			<div class="fila-campos">
				<div class="campo">
					<label for="email">Email</label>
					<input type="email" th:field="*{email}" maxlength="100">
				</div>
				<div class="campo">
					<label for="telefono">Teléfono</label>
					<input type="text" th:field="*{telefono}" maxlength="20">
				</div>
			</div>
			<div class="campo">
				<label for="estadoCuota">Estado de la cuota</label>
				<select th:field="*{estadoCuota}">
					<option th:each="e : ${estados}" th:value="${e}"
						th:text="${e.name() == 'MOROSO'} ? 'Moroso' : 'Al día'">Al día</option>
				</select>
			</div>

			<div class="botones">
				<button type="submit" class="boton">Guardar</button>
				<a class="boton boton--secundario" th:href="@{/socios}">Cancelar</a>
			</div>
		</form>

		<!-- Solo al editar: actividades activas del socio, con baja desde secretaría -->
		<section th:if="${socio.id != null and inscripciones != null}" class="bloque">
			<h2>Actividades activas</h2>
			<p th:if="${#lists.isEmpty(inscripciones)}" class="vacio">No está inscripto en ninguna actividad.</p>
			<ul class="lista-inscripciones" th:unless="${#lists.isEmpty(inscripciones)}">
				<li th:each="i : ${inscripciones}">
					<span th:text="${i.actividad.nombre} + ' · ' + ${i.actividad.dias} + ' ' + ${i.actividad.horario}">Ajedrez</span>
					<form th:action="@{/inscripciones/{id}/baja(id=${i.id}, volverA='socio')}" method="post"
						onsubmit="return confirm('¿Dar de baja esta inscripción?');">
						<button type="submit" class="enlace-peligro">Dar de baja</button>
					</form>
				</li>
			</ul>
			<a class="boton boton--secundario" th:href="@{/inscripciones/nueva(socioId=${socio.id})}">+ Inscribir en otra actividad</a>
		</section>
	</main>

	<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
